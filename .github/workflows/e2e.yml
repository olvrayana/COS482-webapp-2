name: E2E

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Start backend
        working-directory: AMICOServer
        run: |
          nohup sh mvnw -B spring-boot:run > ../backend.log 2>&1 &

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install Playwright
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:8000/; then echo "backend up"; exit 0; fi
            sleep 2
          done
          echo "backend did not start"; cat backend.log; exit 1

      - name: Run Playwright tests
        working-directory: playwright
        run: npx playwright test

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos
          path: playwright/test-results/**/*.webm
          if-no-files-found: warn

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
